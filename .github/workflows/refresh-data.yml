name: Refresh SEC data

# Re-downloads SEC filings, rebuilds every issuer file and generates memos for
# issuers whose financial data changed. Needs repository secrets:
#   SEC_USER_AGENT     e.g. "Tickmark research Your Name you@example.com"
#   DEEPSEEK_API_KEY   for memo generation (optional; memos are skipped without it)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r engine/requirements.txt
      - name: Select universe and download SEC data
        working-directory: engine
        run: |
          python -m pipeline.universe
          python -c "import json; from pipeline import fetch; u=json.load(open('universe.json')); fetch.bulk([x['cik'] for x in u], kinds=('companyfacts',), workers=3)"
      - name: Build issuer dataset
        working-directory: engine
        run: python -m pipeline.build
      - name: Generate AI memos (new or changed issuers only)
        if: env.DEEPSEEK_API_KEY != ''
        working-directory: engine
        run: python -m pipeline.ai --workers 4 && python -m pipeline.build
      - name: Commit refreshed data
        run: |
          git config user.name "tickmark-bot"
          git config user.email "tickmark-bot@users.noreply.github.com"
          git add engine/universe.json public/data
          git diff --cached --quiet || git commit -m "data: weekly SEC refresh"
          git push
